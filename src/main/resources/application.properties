# Spring Boot应用配置
server.port=8081
spring.application.name=cutting-optimization-tool
# 禁用 headless 模式以支持自动打开浏览器
spring.main.headless=false

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 静态资源配置
spring.web.resources.static-locations=classpath:/static/

# 日志配置（详细配置见 logback-spring.xml）
# logging.level 已由 logback-spring.xml 统一管理

# 应用配置
app.exports.directory=exports
app.default.roll-width=4400
app.default.flexible.min-width=4300
app.default.flexible.max-width=4400
app.default.flexible.step-size=10

# 启动时是否自动打开浏览器（设为 false 可禁用）
app.auto-open-browser=false
