# 开放给外部用户的可选配置文件
# ----------------------------------
# 修改此文件中的配置可以覆盖程序默认配置
# 修改保存后，请重新运行“一键启动.bat”

# 服务端口（默认 8081）
server.port=8081

# 默认排产母卷宽度
app.default.roll-width=4400

# 灵活重排默认参数设置
app.default.flexible.min-width=4300
app.default.flexible.max-width=4400
app.default.flexible.step-size=10

# 导出文件的保存目录名（会在此目录下生成 Excel 文件）
app.exports.directory=exports

# 启动时是否自动打开浏览器（可以配合脚本使用，此处通常留空或保持 false，取决于脚本）
# app.auto-open-browser=false
